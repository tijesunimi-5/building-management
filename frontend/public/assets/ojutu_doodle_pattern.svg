<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <style>
      .icon { fill: none; stroke: #10b981; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.18; }
      .icon-alt { fill: none; stroke: #34d399; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.14; }
      .icon-accent { fill: none; stroke: #059669; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.22; }
    </style>
  </defs>
  
  <rect width="360" height="360" fill="#0b131e"/>

  <!-- Row 1 -->
  <!-- Home -->
  <g transform="translate(30, 30) rotate(-10) scale(0.9)" class="icon">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
