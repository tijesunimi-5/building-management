  </g>

  <!-- Row 2 -->
  <!-- Shield -->
  <g transform="translate(60, 110) rotate(15) scale(0.85)" class="icon-accent">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </g>

  <!-- Paintbrush -->
